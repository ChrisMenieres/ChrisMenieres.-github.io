/* Safety net: if anything throws DURING BOOT, show it on screen instead of a blank/loading hang.
   Ignore errors injected by the browser itself (e.g. the __gCrWeb bridge in Brave/Chrome on iOS),
   and never overwrite the screen once the app has already started successfully. */
window.addEventListener("error", function (e) {
  var msg = (e && e.message) ? String(e.message) : "";
  if (msg.indexOf("gCrWeb") >= 0) return;          // browser-injected, not our app
  if (window.__APP_OK) return;                       // app already running fine; ignore stray errors
  var b = document.getElementById("boot") || document.getElementById("root");
  if (b) b.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:0 20px;text-align:left;line-height:1.6;font-family:system-ui,sans-serif">' +
    '<b style="color:#C56B4A">The app hit an error.</b><br><br>' + ((e && e.message) ? e.message : "Unknown error") +
    ((e && e.lineno) ? '<br><span style="font-size:12px;color:#9A9388">line ' + e.lineno + '</span>' : '') +
    '<br><br>A screenshot of this would let me fix it fast.</div>';
});
</script>

    return { input: raw, matches: matches, mechanisms: mechanisms };
  }).filter(function (m) { return String(m.input).trim(); });

}

/* ============================ SVG LINE CHART (string builder) ============================ */
function lineChart(opts) {
  var data = opts.data, series = opts.series, H = opts.height || 180;
  var reversed = !!opts.reversed, normalize = !!opts.normalize, yDomain = opts.yDomain;
  var W = 600, padL = 38, padR = 14, padT = 12, padB = 24;

  var lo, hi, all = [], i;
  if (normalize) { lo = 0; hi = 1; }
  else if (yDomain) { lo = yDomain[0]; hi = yDomain[1]; }
  else {
    data.forEach(function (d) { keys.forEach(function (k) { if (d[k] != null && !isNaN(d[k])) all.push(+d[k]); }); });
    if (all.length) { lo = Math.min.apply(null, all); hi = Math.max.apply(null, all); if (lo === hi) { lo -= 1; hi += 1; } var pad = (hi - lo) * 0.08; lo -= pad; hi += pad; } else { lo = 0; hi = 1; }

    if (!normalize) { var val = lo + (reversed ? (1 - t) : t) * (hi - lo); parts.push('<text x="' + (padL - 5) + '" y="' + (yy + 4) + '" font-size="11" fill="#9A9388" text-anchor="end">' + Math.round(val) + '</text>'); }
  });
  var labelIdx = n <= 1 ? [0] : uniq([0, Math.floor((n - 1) / 2), n - 1]);
  labelIdx.forEach(function (idx) { if (data[idx]) parts.push('<text x="' + xFor(idx) + '" y="' + (H - 7) + '" font-size="11" fill="#9A9388" text-anchor="middle">' + esc(data[idx].x) + '</text>'); });
  series.forEach(function (s) {
    var pts = [];
    data.forEach(function (d, i) { var v = d[s.key]; if (v == null || isNaN(v)) return; v = +v; if (normalize) v = sNorm[s.key](v); pts.push([xFor(i), yFor(v)]); });
    if (!pts.length) return;
    var dPath = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    parts.push('<path d="' + dPath + '" fill="none" stroke="' + s.color + '" stroke-width="2.4" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>');
    pts.forEach(function (p) { parts.push('<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="' + s.color + '"/>'); });
  });
  parts.push('</svg>');
  var legend = "";
  if (opts.legend !== false && series.length > 1) {
    legend = '<div style="display:flex;gap:14px;flex-wrap:wrap;justify-content:center;margin-top:6px">' +
      series.map(function (s) { return '<span style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)"><span style="width:13px;height:3px;background:' + s.color + ';border-radius:2px;display:inline-block"></span>' + esc(s.name || s.key) + '</span>'; }).join("") + '</div>';

function timeline() {
  var am = {}; S.activity.forEach(function (a) { am[a.date] = a; });
  var dates = uniq([].concat(
    S.symptoms.map(function (s) { return s.date; }),
    S.hearing.map(function (h) { return h.date; }),

  if (dates.length < 2) return null;
  return dates.map(function (d) {

      Sugar: items.length ? sum("sugar") : null,
      Caffeine: items.length ? sum("caffeine") : null,
      Alcohol: items.length ? sum("alcohol") : null,
      Fluid: items.length ? sum("fluid") : null,

}

function viewInsights() {

/* ============================ ABOUT ============================ */
function viewAbout() {
  return '<div class="stack">' +
    '<div class="card">' + sectionTitle("About this app") +
      '<p style="font-size:15.5px;line-height:1.7;margin:0 0 12px">Developed by a fellow desperate Ménière\'s sufferer.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">I built this to find and rule out the things that set off my own attacks. It is free. It works offline. Your data stays only on your device — nothing is sent anywhere.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0">It is not a diagnosis. It is a clear map you can take to your doctor, ideally an ENT or neurotologist.</p>' +
    '</div>' +
    '<div class="card">' + sectionTitle("What patterns it looks for") +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">As you log, the app looks for links between your symptoms and many things at once. These include salt, sugar, caffeine, alcohol, fluid, specific foods, your medications and supplements, hours of sleep, daily activity, and the weather (barometric pressure).</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">It goes further than single triggers. It checks each food, drink and medicine by name. It also checks combinations — when two things together (say salt and potassium) seem worse than either one alone.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0">Triggers do not always strike the same day. A flare can lag behind. Three poor nights of sleep, for example, may only show up later. So the app looks for links up to about three days after a trigger, not just the same day.</p>' +
    '</div>' +
    '<div class="card">' + sectionTitle("Why steady logging matters") +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">Patterns need data. A handful of days cannot show a real link. The more consistently you log, and the longer you keep it up, the more you can trust what the app finds.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">For this reason the app waits until you have about <b>8 logged days</b> before it shows any pattern or link. With fewer days, a result can appear by pure chance — a coincidence dressed up as a cause. Until then, you may see "not enough days yet," which is the app being honest rather than guessing. Even after 8 days, more days make every finding firmer.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 10px">To get the best results:</p>' +
      '<ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.8;color:var(--ink)">' +
        '<li>Log a symptom score every day, even good days (a zero is useful data).</li>' +
        '<li>Log your food, drink and medicines each day.</li>' +
        '<li>Add sleep and activity each day.</li>' +
        '<li>Open the app daily to grab the weather.</li>' +
        '<li>Aim for several weeks. Links get firmer the longer you go.</li>' +
      '</ul>' +
    '</div>' +
    '<div class="card">' + sectionTitle("A gentle reminder") +

    '</div>' +
  '</div>';
}

    if (H.pressure_msl && H.pressure_msl[i] != null) pres.push(Math.round(H.pressure_msl[i]));
    if (H.temperature_2m && H.temperature_2m[i] != null) temps.push(Math.round(H.temperature_2m[i]));

    case "addFood": { var nm = d.name; var fd = null; foodList().forEach(function (x) { if (x.name === nm) fd = x; }); if (fd) { var it = { id: uid(), name: fd.name, date: S.ui.dietDate || todayISO(), kind: "food", flags: fd.flags || [] };["sodium", "potassium", "sugar", "caffeine", "alcohol", "fluid"].forEach(function (k) { it[k] = num(fd[k]); }); S.diet.push(it); persist(); render(); } break; }

      var mn = (gv("medName") || "").trim(); if (!mn) { alert("Type the medication or supplement name first."); break; }
      addMedByName(mn); persist(); render(); break;
    }
    case "medFromList": { S.ui.medListOpen = !S.ui.medListOpen; render(); break; }
    case "toggleRescue": {
      if (d.name) {
        if (!S.rescueMeds) S.rescueMeds = [];
        var lo = d.name.toLowerCase();
        if (S.rescueMeds.some(function (x) { return x.toLowerCase() === lo; })) {
          S.rescueMeds = S.rescueMeds.filter(function (x) { return x.toLowerCase() !== lo; });
        } else {
          S.rescueMeds.push(d.name);
        }
        persist(); render();
      }
      break;
    }
    case "addMedName": { if (d.name) { addMedByName(d.name); persist(); render(); } break; }
    case "delMedName": {
      if (d.name) {
        var low = d.name.toLowerCase();
        S.medList = (S.medList || []).filter(function (x) { return x.toLowerCase() !== low; });
        persist(); render();
      }
      break;
    }
    case "copyYday": {
      var curDate = S.ui.dietDate || todayISO();
      var yday = addDays(curDate, -1);
      var isMed = (d.kind === "med");
      var matchKind = function (x) { return isMed ? x.kind === "med" : x.kind !== "med"; };
      var src = S.diet.filter(function (x) { return x.date === yday && matchKind(x); });
      var label = isMed ? "medicines or supplements" : "food or drink";
      if (!src.length) { alert("Nothing was logged for " + label + " yesterday (" + fmtDay(yday) + "). Nothing to copy."); break; }
      // group yesterday's entries by name, so quantity (and any edited values) carry over
      var ydByName = {};
      src.forEach(function (x) { var key = (x.name || "").toLowerCase(); (ydByName[key] = ydByName[key] || []).push(x); });
      // count what's already logged today, per name
      var todayCount = {};
      S.diet.filter(function (x) { return x.date === curDate && matchKind(x); }).forEach(function (x) { var key = (x.name || "").toLowerCase(); todayCount[key] = (todayCount[key] || 0) + 1; });
      var added = 0;
      Object.keys(ydByName).forEach(function (key) {
        var entries = ydByName[key];
        var need = entries.length - (todayCount[key] || 0); // top today up to yesterday's quantity
        if (need <= 0) return;
        entries.slice(entries.length - need).forEach(function (x) {
          var copy = {}; for (var k in x) { if (Object.prototype.hasOwnProperty.call(x, k)) copy[k] = x[k]; }
          copy.id = uid(); copy.date = curDate;
          if (copy.flags) copy.flags = copy.flags.slice();
          S.diet.push(copy); added++;
        });
      });
      if (added === 0) alert("Yesterday's " + label + " are already all logged for today.");
      persist(); render(); break;
    }
    case "addCustom": {
      var name = (gv("cfName") || "").trim(); if (!name) { alert("Give the item a name."); break; }
      S.customFoods.unshift({ name: name, sodium: nv("cfSodium"), potassium: nv("cfPotassium"), sugar: nv("cfSugar"), caffeine: nv("cfCaffeine"), alcohol: nv("cfAlcohol"), fluid: nv("cfFluid"), flags: [] });
      S.ui.foodQuery = name; persist(); render(); break;
    }
    case "delCustom": S.customFoods.splice(num(d.i), 1); persist(); render(); break;
    case "editDiet": S.ui.editDietId = d.id; render(); break;
    case "cancelEdit": S.ui.editDietId = null; render(); break;
    case "saveDiet": { S.diet.forEach(function (x) { if (x.id === d.id) {["sodium", "potassium", "sugar", "caffeine", "alcohol", "fluid"].forEach(function (k) { x[k] = nv("ed_" + k); }); } }); S.ui.editDietId = null; persist(); render(); break; }
    case "delDiet": S.diet = S.diet.filter(function (x) { return x.id !== d.id; }); persist(); render(); break;
    case "wxSave": { var wd = gv("wxDate") || todayISO(); var pr = gv("wxPressure"); if (pr === "") { alert("Enter the pressure value."); break; } var tIn = gv("wxTemp"); var tF = null; if (tIn !== "") { var tv = num(tIn); tF = (S.profile.units === "C") ? Math.round(tv * 9 / 5 + 32) : Math.round(tv); } var hIn = gv("wxHum"); var hV = (hIn !== "") ? Math.round(num(hIn)) : null; var pV = Math.round(num(pr)); S.weather[wd] = { pMean: pV, pMin: pV, pMax: pV, tMean: tF, tMin: tF, tMax: tF, humidity: hV, hMin: hV, hMax: hV }; S.ui.wxStatus = ""; persist(); render(); break; }
    case "wxSearch": { S.ui.wxCityQ = (gv("wxCity") || "").trim(); wxSearchCity(S.ui.wxCityQ); break; }
    case "wxPick": { var rs = S.ui.wxResults || []; var pk = rs[num(d.i)]; if (pk) { var lab = pk.name + (pk.state ? ", " + pk.state : "") + (pk.country ? ", " + pk.country : ""); owmCurrent(pk.lat, pk.lon, lab); } break; }
    case "wxToday": { if (S.profile.lat != null) owmCurrent(S.profile.lat, S.profile.lng, S.profile.place); break; }
    case "wxGeo": geoWeather(); break;
    case "wxUnits": { S.profile.units = (d.u === "C" ? "C" : "F"); persist(); render(); break; }
    case "addCond": { var c = (gv("condInput") || "").trim(); if (c) { S.conditions.push(c); persist(); render(); } break; }
    case "delCond": S.conditions.splice(num(d.i), 1); persist(); render(); break;
    case "toggleCause": S.ui.openCause = (S.ui.openCause === d.id ? null : d.id); render(); break;
    case "ans": { if (!S.answers[d.cause]) S.answers[d.cause] = {}; if (S.answers[d.cause][d.q] === d.key) delete S.answers[d.cause][d.q]; else S.answers[d.cause][d.q] = d.key; persist(); render(); break; }
    case "testSet": { if (S.tests[d.id] === d.val) delete S.tests[d.id]; else S.tests[d.id] = d.val; persist(); render(); break; }
    case "sbToggle": { S.tests.stopbang = S.tests.stopbang || {}; S.tests.stopbang[d.k] = !S.tests.stopbang[d.k]; persist(); render(); break; }
    case "insFactor": S.ui.insFactor = d.key; render(); break;
    case "tlToggle": {
      var cur = (S.ui.tlSeries && S.ui.tlSeries.length) ? S.ui.tlSeries.slice() : TL_DEFAULT.slice();
      var ix = cur.indexOf(d.key); if (ix >= 0) cur.splice(ix, 1); else cur.push(d.key);
      S.ui.tlSeries = cur; persist(); render(); break;
    }
    case "actToggle": { S.ui.actSel = S.ui.actSel || {}; S.ui.actSel[d.k] = !S.ui.actSel[d.k]; render(); break; }
    case "addActivity": {
      var an = (gv("actCustom") || "").trim(); if (!an) { alert("Type an activity name first."); break; }
      if (S.customActivities.indexOf(an) < 0 && DEFAULT_ACTS.indexOf(an) < 0) S.customActivities.push(an);
      S.ui.actSel = S.ui.actSel || {}; S.ui.actSel[an] = true; persist(); render(); break;
    }
    case "delCustomAct": { var ci = num(d.i); S.customActivities.splice(ci, 1); persist(); render(); break; }
    case "actSave": {
      var adate = gv("actDate") || todayISO();
      var sh = gv("actSleep"); var hours = (sh === "" || sh == null) ? null : num(sh);
      var sel = S.ui.actSel || {}; var acts = Object.keys(sel).filter(function (k) { return sel[k]; });
      var anote = S.ui.actNote || "";
      var sstress = num(S.ui.actStress || 0); var stressVal = sstress > 0 ? sstress : null;
      S.activity = S.activity.filter(function (a) { return a.date !== adate; });
      S.activity.push({ date: adate, sleepHours: hours, stress: stressVal, activities: acts, notes: anote });
      S.ui.actLoadedFor = null; persist(); render(); break;
    }
    case "actDel": { S.activity = S.activity.filter(function (a) { return a.date !== d.date; }); S.ui.actLoadedFor = null; persist(); render(); break; }
    case "expReport": download("meniere-report.txt", buildReport(computeResults()), "text/plain"); break;
    case "expJson": download("meniere-backup.json", JSON.stringify({ profile: S.profile, symptoms: S.symptoms, diet: S.diet, customFoods: S.customFoods, activity: S.activity, customActivities: S.customActivities, weather: S.weather, answers: S.answers, tests: S.tests, conditions: S.conditions, hearing: S.hearing, tlSeries: S.ui.tlSeries, exportedAt: new Date().toISOString() }, null, 2), "application/json"); S.meta.lastBackup = new Date().toISOString(); persist(); render(); break;
    case "snoozeBackup": S.meta.nudgeSnoozed = new Date().toISOString(); persist(); render(); break;
    case "installDismiss": S.meta.installDismissed = true; persist(); render(); break;
    case "installNow": {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (c) {
          if (c && c.outcome === "accepted") { S.meta.installDismissed = true; persist(); }
          deferredPrompt = null; render();
        });
      }
      break;
    }
    case "restore": { var rf = document.getElementById("restoreFile"); if (rf) rf.click(); break; }
    default: break;
  }
}

/* ============================ MOUNT ============================ */
document.addEventListener("click", onClick);
render();
/* Auto-pull today's weather when the app opens, using the saved location.
   One call covers the whole day, so opening once (e.g. in the evening) is enough. */
if (S.profile && S.profile.lat != null && S.profile.lng != null && S.ui.lastAutoWx !== todayISO()) {
  try { fetchWeather(S.profile.lat, S.profile.lng, S.profile.place, true); } catch (e) {}
}
window.__APP_OK = true;

})();
</script>
