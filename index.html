  var b = document.getElementById("boot") || document.getElementById("root");

    '<br><br>A screenshot of this would let me fix it fast.</div>';
});

        '<div style="font-size:12.5px;color:var(--muted);margin:8px 0;line-height:1.5">Read each dB value off your audiogram photo, for each ear at each pitch (Hz).</div>' +

          '<div></div><div style="font-size:12px;font-weight:700;color:var(--primary);text-align:center">Left</div><div style="font-size:12px;font-weight:700;color:var(--accent);text-align:center">Right</div>' +
          AUDIO_FREQS.map(function (f) { return '<div style="font-size:12.5px;font-weight:700;color:var(--muted)">' + freqLabel(f) + ' Hz</div><input class="inp" style="padding:8px;text-align:center" id="fqL_' + f + '" inputmode="numeric" value="' + esc(hf.freqL[f] != null ? hf.freqL[f] : "") + '"><input class="inp" style="padding:8px;text-align:center" id="fqR_' + f + '" inputmode="numeric" value="' + esc(hf.freqR[f] != null ? hf.freqR[f] : "") + '">'; }).join("") +
        '</div></details>' +
      '<label class="lbl">Source</label><select class="inp" id="hearSource">' + sources.map(function (s) { return '<option ' + (hf.source === s ? "selected" : "") + '>' + esc(s) + '</option>'; }).join("") + '</select>' +
      '<label class="lbl">Notes (optional)</label><textarea class="inp" id="hearNotes" rows="2" placeholder="During a flare? Ear felt full? Which app?" style="resize:vertical">' + esc(hf.notes) + '</textarea>' +

      '</div>' : '') +
    '<div class="card">' + sectionTitle("Hearing over time", "Watch for a drop, or one ear that comes and goes — fluctuating one-sided loss is the classic Ménière's pattern.") +

        lineChart({ data: chart, series: [{ key: "Left", color: "#3C6E62", name: "Left" }, { key: "Right", color: "#C56B4A", name: "Right" }], height: 190, reversed: true }) +
        '<p style="font-size:12px;color:var(--faint);margin:4px 0 12px">Axis is flipped so worse hearing (higher dB) sits lower, like a real audiogram.</p>' +

    '</div>' +
  '</div>';
}

    '</div>' +
    '<div class="card">' + sectionTitle("Medications & supplements", "Important: also log any medicine, supplement, vitamin or herbal remedy you took on this day — prescription or over-the-counter. The app tracks each by name and checks it for patterns too, just like foods.") +
      '<div class="row"><input class="inp" id="medName" style="flex:1" placeholder="e.g. Betahistine, magnesium, ibuprofen"><button class="btn soft" data-act="addMed">' + ic("plus", 15) + ' Add</button></div>' +
      (medItems.length ? '<div class="stack" style="gap:7px;margin-top:12px">' + medItems.map(function (d) { return '<div class="listitem"><div><div style="font-weight:600">' + esc(d.name) + '</div><div style="font-size:11.5px;color:var(--faint)">medication / supplement</div></div><button class="iconbtn" data-act="delDiet" data-id="' + d.id + '">' + ic("trash", 15) + '</button></div>'; }).join("") + '</div>' : '<p style="margin:10px 0 0;font-size:12.5px;color:var(--faint)">Nothing logged for this day yet.</p>') +

        }).join("")) +

function viewWeather() {
  var days = Object.keys(S.weather).sort();
  var data = days.map(function (d) { return { x: fmtDay(d), Pressure: S.weather[d].pMean, Temp: tShow(S.weather[d].tMean) }; });
  var st = S.ui.wxStatus || "";
  var results = S.ui.wxResults;
  var attribution = '<p style="margin:10px 0 0;font-size:11.5px;color:var(--faint)">Weather data by <a href="https://openweathermap.org/" style="color:var(--faint)">OpenWeather</a>.</p>';
  function statusBlock() {
    if (st === "nokey") return '<div class="note" style="background:var(--goldSoft);color:#8A6516;margin-top:12px;align-items:flex-start">' + ic("alert", 16, "#C99A3F") + '<span>No weather key yet. The app owner needs to paste a free OpenWeatherMap key into the code (top of the file). Until then, use manual entry below.</span></div>';
    if (st === "keybad") return '<div class="note" style="background:var(--accentSoft);color:#7A4A36;margin-top:12px;align-items:flex-start">' + ic("alert", 16, "#C56B4A") + '<span>The weather key was not accepted (it can take up to ~2 hours to activate after sign-up, or it may be mistyped). Manual entry below always works.</span></div>';
    if (st === "blocked") return '<p style="margin:10px 0 0;font-size:13.5px;color:var(--accent);line-height:1.5">Couldn\'t reach the weather service from here. This is blocked inside the Claude preview and when the file is opened directly (file://). It works on a hosted web page opened in a browser. Manual entry below always works.</p>';
    if (st) return '<p style="margin:10px 0 0;font-size:13.5px;color:var(--muted);line-height:1.5">' + esc(st) + '</p>';
    return "";
  }
  var resultsBlock = "";
  if (results && results.length) {
    resultsBlock = '<div class="stack" style="gap:6px;margin-top:10px">' + results.map(function (p, i) { var label = p.name + (p.state ? ", " + p.state : "") + (p.country ? ", " + p.country : ""); return '<button class="btn ghost" style="text-align:left;font-weight:600" data-act="wxPick" data-i="' + i + '">' + esc(label) + '</button>'; }).join("") + '</div>';
  } else if (results && results.length === 0) {
    resultsBlock = '';
  }
  return '<div class="stack">' +
    '<div class="card">' + sectionTitle("Today's weather", "Falling barometric pressure (stormy weather) is a common flare trigger. Pull today's reading with one tap — easiest is your location, and it works anywhere in the world. Open the app each day to keep the trend going.") +
      '<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><div style="display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden"><button class="' + (S.profile.units !== "C" ? "" : "") + '" data-act="wxUnits" data-u="F" style="border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:7px 14px;background:' + (S.profile.units !== "C" ? "var(--primary)" : "transparent") + ';color:' + (S.profile.units !== "C" ? "#fff" : "var(--muted)") + '">°F</button><button data-act="wxUnits" data-u="C" style="border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;padding:7px 14px;background:' + (S.profile.units === "C" ? "var(--primary)" : "transparent") + ';color:' + (S.profile.units === "C" ? "#fff" : "var(--muted)") + '">°C</button></div></div>' +
      '<button class="btn primary" data-act="wxGeo" style="width:100%">' + ic("compass", 16) + ' Use my location</button>' +
      '<div style="display:flex;align-items:center;gap:10px;margin:12px 0;color:var(--faint);font-size:12.5px"><div style="flex:1;height:1px;background:var(--line)"></div>or search a place<div style="flex:1;height:1px;background:var(--line)"></div></div>' +
      '<div class="row"><input class="inp" id="wxCity" style="flex:1" placeholder="Town or city (any country)" value="' + esc(S.ui.wxCityQ || "") + '"><button class="btn ghost" data-act="wxSearch">' + ic("refresh", 15) + ' Search</button></div>' +
      resultsBlock +
      (S.profile.place ? '<p style="margin:10px 0 0;font-size:13.5px;color:var(--primary);font-weight:700">Saved place: ' + esc(S.profile.place) + '</p><button class="btn soft" data-act="wxToday" style="margin-top:8px">' + ic("refresh", 15) + ' Update today for this place</button>' : '') +
      statusBlock() +
      attribution +
    '</div>' +
    '<div class="card">' + sectionTitle("Enter pressure by hand", "Always works, no internet needed. Read pressure from any weather app (often shown in mb or hPa, around 1000-1025).") +
      '<label class="lbl">Date</label><input class="inp" type="date" id="wxDate" value="' + todayISO() + '" max="' + todayISO() + '">' +
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">' +
        '<div><label class="lbl">Pressure (hPa / mb)</label><input class="inp" id="wxPressure" inputmode="decimal" placeholder="e.g. 1013"></div>' +
        '<div><label class="lbl">Temp (' + tUnit() + ', optional)</label><input class="inp" id="wxTemp" inputmode="numeric" placeholder="e.g. ' + (S.profile.units === "C" ? "20" : "68") + '"></div>' +
      '</div>' +
      '<div style="margin-top:14px"><button class="btn primary" data-act="wxSave">Save by hand</button></div>' +
      '<p style="margin:12px 0 0;font-size:12px;color:var(--faint);line-height:1.5">If your weather app shows pressure in inches (inHg): 1 inHg = 33.9 hPa.</p>' +
    '</div>' +
    (days.length ? '<div class="card">' + sectionTitle("Barometric pressure (hPa)", "Lower means stormier. Watch for symptom days after a sharp drop.") + lineChart({ data: data, series: [{ key: "Pressure", color: "#3C6E62", name: "Pressure" }], height: 190, legend: false }) + attribution + '</div>' +
      '<div class="card">' + sectionTitle("Temperature (" + tUnit() + ")") + lineChart({ data: data, series: [{ key: "Temp", color: "#C99A3F", name: "Temp" }], height: 170, legend: false }) + '</div>' : '') +
  '</div>';
}

function causeChips(ids) { return '<div style="display:flex;flex-wrap:wrap;gap:5px">' + ids.map(function (id) { return '<span style="font-size:12px;font-weight:700;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px 9px">→ ' + esc(causeName(id)) + '</span>'; }).join("") + '</div>'; }
function viewQuiz() {
  var matched = matchConditions(S.conditions);
  var hints = aggregateCauseLinks(matched);
  var condHtml = "";
  if (S.conditions.length) {
    condHtml = '<div class="stack" style="gap:8px;margin-top:12px">' + matched.map(function (m, i) {
      var matchCauses = flat(m.matches.map(function (c) { return c.causes; }));
      var extraMech = m.mechanisms.filter(function (mech) { return mech.causes.some(function (id) { return matchCauses.indexOf(id) < 0; }); });
      var html = '<div style="border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:700">' + esc(m.input) + '</span><button class="iconbtn" data-act="delCond" data-i="' + i + '">' + ic("trash", 15) + '</button></div>';
      m.matches.forEach(function (c) { html += '<div style="margin-top:8px;background:var(--primarySoft);border-radius:10px;padding:10px"><div style="font-size:13.5px;font-weight:700;color:var(--primary)">Recognised: ' + esc(c.name) + '</div><div style="font-size:13px;color:#2F5D52;line-height:1.55;margin:3px 0 6px">' + esc(c.note) + '</div>' + causeChips(c.causes) + '</div>'; });
      var mechs = (m.matches.length === 0 ? m.mechanisms : extraMech);
      mechs.forEach(function (mech) { html += '<div style="margin-top:8px;background:var(--goldSoft);border-radius:10px;padding:10px"><div style="font-size:13.5px;font-weight:700;color:#8A6516">' + (m.matches.length === 0 ? "Possible link" : "Also worth considering") + ': ' + esc(mech.label) + '</div><div style="font-size:13px;color:#7A5A12;line-height:1.55;margin:3px 0 6px">' + esc(mech.why) + '</div>' + causeChips(mech.causes) + '</div>'; });
      if (m.matches.length === 0 && m.mechanisms.length === 0) html += '<div style="margin-top:7px;font-size:13px;color:var(--muted);line-height:1.5">No direct or mechanism link found in our reference. Still worth mentioning to your doctor.</div>';
      return html + '</div>';
    }).join("") + '</div>';
  }
  var quizHtml = CAUSES.map(function (c) {
    var res = classify(S.answers[c.id], c.questions);
    var open = S.ui.openCause === c.id;
    var hintArr = hints[c.id] || [];
    var body = "";
    if (open) {
      body = '<div style="padding:0 16px 16px;border-top:1px solid var(--line)">';
      if (hintArr.length) body += '<div class="note" style="background:var(--primarySoft);color:#2F5D52;margin-top:14px">' + ic("info", 16, "#3C6E62") + '<span>From your health profile, this may relate to: <b>' + esc(hintArr.join(", ")) + '</b>.</span></div>';
      if (c.clinicalFlag) body += '<div class="note" style="background:var(--goldSoft);color:#8A6516;margin-top:14px">' + ic("alert", 16, "#C99A3F") + '<span>' + esc(c.clinicalFlag) + '</span></div>';
      body += '<div class="stack" style="margin-top:16px">' + c.questions.map(function (q) {
        var opts = optsFor(q);
        return '<div><div style="font-size:14.5px;font-weight:600;margin-bottom:' + (q.help ? "3px" : "8px") + ';line-height:1.5">' + esc(q.q) + '</div>' + (q.help ? '<div style="font-size:12.5px;color:var(--faint);font-style:italic;margin-bottom:8px;line-height:1.45">' + esc(q.help) + '</div>' : '') + '<div style="display:flex;flex-wrap:wrap;gap:7px">' + opts.map(function (opt) { var on = S.answers[c.id] && S.answers[c.id][q.id] === opt.key; var neutral = opt.v == null; return '<button class="chip ' + (on ? "on" : "") + (on && neutral ? " idk" : "") + '" data-act="ans" data-cause="' + c.id + '" data-q="' + q.id + '" data-key="' + opt.key + '">' + esc(opt.label) + '</button>'; }).join("") + '</div></div>';
      }).join("") + '</div></div>';
    }
    return '<div class="card" style="padding:0;overflow:hidden"><button data-act="toggleCause" data-id="' + c.id + '" style="width:100%;border:none;background:transparent;cursor:pointer;padding:16px;display:flex;align-items:center;gap:12px;text-align:left"><div style="flex:1"><div style="font-weight:800;font-size:15.5px">' + c.n + '. ' + esc(c.name) + '</div><div style="font-size:12.5px;color:var(--muted);line-height:1.4">' + esc(c.blurb) + '</div></div>' + pill(res.tone, res.label) + '</button>' + body + '</div>';
  }).join("");
  return '<div class="stack">' +
    '<div class="card">' + sectionTitle("Your chronic illnesses", "List anything you've been diagnosed with. The app reasons about how each could relate to Ménière's — through known links and shared mechanisms like salt balance, blood flow, or immune activity.") +
      '<div class="row"><input class="inp" id="condInput" style="flex:1" placeholder="e.g. cystic fibrosis, Raynaud\'s, migraine"><button class="btn primary" data-act="addCond">' + ic("plus", 16) + '</button></div>' + condHtml +
    '</div>' +
    '<div class="card">' + sectionTitle("Cause questionnaires", "Answer honestly. 'I don't know' is a real answer — it lowers confidence instead of guessing.") + disclaimer(true) + '</div>' +
    quizHtml +
  '</div>';
}

function viewTests() {
  var html = '<div class="stack">' +
    '<div class="card">' + sectionTitle("At-home self-tests", "Simple checks you can do safely and report. They hint at a direction; they do not confirm anything.") +
      '<div class="note" style="background:#FBF3EE;border:1px solid var(--accentSoft);color:#7A4A36">' + ic("alert", 17, "#C56B4A") + '<span>Do balance and position tests only with support nearby. Stop if you feel unsafe. The Dix-Hallpike test is best done <b>with a clinician</b>, not alone, as it can set off strong spinning.</span></div>' +
    '</div>';
  SELFTESTS.forEach(function (t) {

function timeline() {
  var am = {}; S.activity.forEach(function (a) { am[a.date] = a; });
  var dates = uniq([].concat(
    S.symptoms.map(function (s) { return s.date; }),
    S.hearing.map(function (h) { return h.date; }),
    S.diet.map(function (d) { return d.date; }),
    Object.keys(S.weather),
    S.activity.map(function (a) { return a.date; })
  )).sort();
  if (dates.length < 2) return null;
  return dates.map(function (d) {
    var sym = null; S.symptoms.forEach(function (s) { if (s.date === d) sym = s; });
    var hear = null; S.hearing.forEach(function (h) { if (h.date === d) hear = h; });
    var items = S.diet.filter(function (x) { return x.date === d; });
    function sum(k) { var t = 0; items.forEach(function (x) { t += num(x[k]); }); return t; }
    var wx = S.weather[d]; var act = am[d];
    var hloss = null; if (hear) { var vals = [hear.leftDb, hear.rightDb].filter(function (v) { return v != null; }); if (vals.length) hloss = Math.max.apply(null, vals); }
    return {
      x: fmtDay(d),
      Symptoms: sym ? sym.severity : null,
      "Hearing loss": hloss,
      Sodium: items.length ? sum("sodium") : null,
      Potassium: items.length ? sum("potassium") : null,
      Sugar: items.length ? sum("sugar") : null,
      Caffeine: items.length ? sum("caffeine") : null,
      Alcohol: items.length ? sum("alcohol") : null,
      Fluid: items.length ? sum("fluid") : null,
      Pressure: wx && wx.pMean != null ? wx.pMean : null,
      Temperature: wx && wx.tMean != null ? tShow(wx.tMean) : null,
      "Sleep hours": (act && act.sleepHours != null && act.sleepHours !== "") ? num(act.sleepHours) : null
    };
  });
}

function viewAbout() {
  return '<div class="stack">' +
    '<div class="card">' + sectionTitle("About this app") +
      '<p style="font-size:15.5px;line-height:1.7;margin:0 0 12px">Developed by a fellow desperate Ménière\'s sufferer.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">I built this to find and rule out the things that set off my own attacks. It is free. It works offline. Your data stays only on your device — nothing is sent anywhere.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0">It is not a diagnosis. It is a clear map you can take to your doctor, ideally an ENT or neurotologist.</p>' +
    '</div>' +
    '<div class="card">' + sectionTitle("What patterns it looks for") +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">As you log, the app looks for links between your symptoms and many things at once. These include salt, sugar, caffeine, alcohol, fluid, specific foods, your medications and supplements, hours of sleep, daily activity, and the weather (barometric pressure).</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">It goes further than single triggers. It checks each food, drink and medicine by name. It also checks combinations — when two things together (say salt and potassium) seem worse than either one alone.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0">Triggers do not always strike the same day. A flare can lag behind. Three poor nights of sleep, for example, may only show up later. So the app looks for links up to about three days after a trigger, not just the same day.</p>' +
    '</div>' +
    '<div class="card">' + sectionTitle("Why steady logging matters") +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 12px">Patterns need data. A handful of days cannot show a real link. The more consistently you log, and the longer you keep it up, the more you can trust what the app finds.</p>' +
      '<p style="font-size:15px;line-height:1.7;margin:0 0 10px">To get the best results:</p>' +
      '<ul style="margin:0;padding-left:20px;font-size:15px;line-height:1.8;color:var(--ink)">' +
        '<li>Log a symptom score every day, even good days (a zero is useful data).</li>' +
        '<li>Log your food, drink and medicines each day.</li>' +
        '<li>Add sleep and activity each day.</li>' +
        '<li>Open the app daily to grab the weather.</li>' +
        '<li>Aim for several weeks. Links get firmer the longer you go.</li>' +
      '</ul>' +
    '</div>' +
    '<div class="card">' + sectionTitle("A gentle reminder") +
      '<p style="font-size:15px;line-height:1.7;margin:0">This is a learning and tracking tool, not medical advice. Always confirm anything you find here with a qualified doctor before changing your care.</p>' +
    '</div>' +
  '</div>';
}

/* ============================ NAV + RENDER ============================ */
var TABS = [["about", "About", "info"], ["home", "Home", "home"], ["symptoms", "Symptoms", "activity"], ["hearing", "Hearing", "ear"], ["diet", "Diet", "food"], ["activity", "Activity", "run"], ["weather", "Weather", "cloud"], ["quiz", "Causes", "list"], ["tests", "Tests", "clipcheck"], ["insights", "Patterns", "chart"], ["results", "Results", "target"], ["next", "Next", "compass"]];
function viewFor(tab) {
  switch (tab) {
    case "about": return viewAbout();
    case "symptoms": return viewSymptoms();
    case "hearing": return viewHearing();
    case "diet": return viewDiet();
    case "activity": return viewActivity();
    case "weather": return viewWeather();
    case "quiz": return viewQuiz();
    case "tests": return viewTests();
    case "insights": return viewInsights();
    case "results": return viewResults();
    case "next": return viewNext();
    default: return viewHome();
  }
}
function navBar() {
  return '<nav class="tabs">' + TABS.map(function (t) { return '<button data-act="tab" data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? "on" : "") + '">' + ic(t[2], 20, (S.tab === t[0] ? "var(--primary)" : "var(--faint)")) + '<span>' + t[1] + '</span></button>'; }).join("") + '</nav>';
}
var _lastTab = null;
function render() {
  document.body.className = S.ui.afont ? "afont" : "";
  var root = document.getElementById("root");
  root.innerHTML =
    '<header style="position:sticky;top:0;z-index:5;background:rgba(247,244,238,0.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)"><div class="wrap" style="display:flex;align-items:center;gap:11px;padding:13px 16px">' +
      '<div style="width:34px;height:34px;border-radius:10px;background:var(--primary);display:grid;place-items:center">' + ic("waves", 20, "#fff") + '</div>' +
      '<div><div style="font-weight:800;font-size:16.5px;line-height:1.1">Ménière\'s Finder</div><div style="font-size:11.5px;color:var(--muted)">Find &amp; rule out root causes</div></div>' +
    '</div></header>' +
    '<main style="padding:16px 14px 100px"><div class="wrap">' + viewFor(S.tab) + '</div></main>' +
    navBar();
  afterRender();
  if (S.tab !== _lastTab) { window.scrollTo(0, 0); _lastTab = S.tab; }
}

/* ============================ FIELD LISTENERS (re-attached each render) ============================ */
function gv(id) { var el = document.getElementById(id); return el ? el.value : ""; }
function nv(id) { return num(gv(id)); }
function foodList() { return S.customFoods.concat(FOODS); }
function renderFoodMatches() {
  var box = document.getElementById("foodMatches"); if (!box) return;
  var q = (S.ui.foodQuery || "").toLowerCase().trim();
  if (!q) { box.innerHTML = ""; return; }
  var list = foodList().filter(function (f) { return f.name.toLowerCase().indexOf(q) >= 0; }).slice(0, 8);
  if (!list.length) { box.innerHTML = '<div style="font-size:13px;color:var(--faint);padding:4px 2px">No match. Add it as a custom item below.</div>'; return; }
  box.innerHTML = list.map(function (f) { return '<button class="btn ghost" style="display:flex;justify-content:space-between;text-align:left;font-weight:600" data-act="addFood" data-name="' + esc(f.name) + '"><span>' + esc(f.name) + '</span><span style="color:var(--faint);font-weight:500;font-size:12px">' + num(f.sodium) + 'mg Na</span></button>'; }).join("");
}
function afterRender() {
  var fs = document.getElementById("foodSearch");
  if (fs) { fs.addEventListener("input", function () { S.ui.foodQuery = fs.value; renderFoodMatches(); }); renderFoodMatches(); }
  var dd = document.getElementById("dietDate");
  if (dd) dd.addEventListener("change", function () { S.ui.dietDate = dd.value; S.ui.editDietId = null; render(); });
  var sev = document.getElementById("sev");
  if (sev) sev.addEventListener("input", function () { S.ui.sev = num(sev.value); var lab = document.getElementById("sevVal"); if (lab) lab.textContent = sev.value + "/10"; });
  var sn = document.getElementById("symNote"); if (sn) sn.addEventListener("input", function () { S.ui.symNote = sn.value; });
  var sdt = document.getElementById("symDate"); if (sdt) sdt.addEventListener("change", function () { S.ui.symDate = sdt.value; });
  ["hearDate", "hearLeft", "hearRight", "hearNotes"].forEach(function (id) { var el = document.getElementById(id); if (el) el.addEventListener("input", function () { var hf = S.ui.hearForm || {}; if (id === "hearDate") hf.date = el.value; else if (id === "hearLeft") hf.left = el.value; else if (id === "hearRight") hf.right = el.value; else hf.notes = el.value; S.ui.hearForm = hf; }); });
  var hsrc = document.getElementById("hearSource"); if (hsrc) hsrc.addEventListener("change", function () { var hf = S.ui.hearForm || {}; hf.source = hsrc.value; S.ui.hearForm = hf; });
  var wc = document.getElementById("wxCity"); if (wc) wc.addEventListener("input", function () { S.ui.wxCityQ = wc.value; });
  var ad = document.getElementById("actDate"); if (ad) ad.addEventListener("change", function () { S.ui.actDate = ad.value; S.ui.actLoadedFor = null; render(); });
  var asl = document.getElementById("actSleep"); if (asl) asl.addEventListener("input", function () { S.ui.actSleep = asl.value; });
  var ano = document.getElementById("actNote"); if (ano) ano.addEventListener("input", function () { S.ui.actNote = ano.value; });
  var sfile = document.getElementById("hearImg"); if (sfile) sfile.addEventListener("change", onHearImage);
  var rfile = document.getElementById("restoreFile"); if (rfile) rfile.addEventListener("change", onRestoreFile);
}

/* ============================ FILE / SCAN / WEATHER ============================ */
function download(filename, text, mime) {
  try { var blob = new Blob([text], { type: mime || "text/plain" }); var url = URL.createObjectURL(blob); var a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500); }
  catch (e) { alert("Could not create the file: " + e.message); }
}
function readHearForm() {
  var hf = S.ui.hearForm || {}; if (!hf.freqL) hf.freqL = {}; if (!hf.freqR) hf.freqR = {};
  hf.date = gv("hearDate") || hf.date || todayISO();
  hf.left = gv("hearLeft"); hf.right = gv("hearRight");
  var src = gv("hearSource"); if (src) hf.source = src;
  hf.notes = gv("hearNotes");
  AUDIO_FREQS.forEach(function (f) { var l = document.getElementById("fqL_" + f); var r = document.getElementById("fqR_" + f); if (l) hf.freqL[f] = l.value; if (r) hf.freqR[f] = r.value; });
  var dt = document.getElementById("hfDetails"); if (dt) S.ui.hearFreqOpen = !!dt.open;
  S.ui.hearForm = hf; return hf;
}
function onHearImage(e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  readHearForm();
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      try {
        var max = 1100, w = img.width, h = img.height, sc = Math.min(1, max / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
        var cv = document.createElement("canvas"); cv.width = cw; cv.height = ch;
        cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
        S.ui.hearForm.image = cv.toDataURL("image/jpeg", 0.72);
      } catch (er) { S.ui.hearForm.image = reader.result; }
      render();
    };
    img.onerror = function () { S.ui.hearForm.image = reader.result; render(); };
    img.src = reader.result;
  };
  reader.onerror = function () { alert("Couldn't read that image. Try another photo."); };
  reader.readAsDataURL(file);
}
function onRestoreFile(e) {
  var file = e.target.files && e.target.files[0]; if (!file) return;
  var rd = new FileReader();
  rd.onload = function () {
    try {
      var d = JSON.parse(rd.result);
      if (!confirm("Restoring will replace the data currently in the app. Continue?")) return;
      S.profile = d.profile || S.profile; S.symptoms = d.symptoms || []; S.diet = d.diet || []; S.customFoods = d.customFoods || [];
      S.activity = d.activity || []; S.customActivities = d.customActivities || [];
      S.weather = d.weather || {}; S.answers = d.answers || {}; S.tests = d.tests || {}; S.conditions = d.conditions || []; S.hearing = d.hearing || []; S.ui.afont = !!d.afont; S.ui.tlSeries = d.tlSeries || null; S.ui.actLoadedFor = null;
      persist(); render(); alert("Backup restored.");
    } catch (er) { alert("That file could not be read as a backup."); }
  };
  rd.readAsText(file);
}
function owmCurrent(lat, lon, label) {
  if (!OWM_KEY) { S.ui.wxStatus = "nokey"; render(); return; }
  S.ui.wxStatus = "Getting current weather…"; render();
  var url = "https://api.openweathermap.org/data/2.5/weather?lat=" + lat + "&lon=" + lon + "&units=imperial&appid=" + OWM_KEY;
  fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (w) {
    var m = w.main || {};
    var pres = (m.sea_level != null) ? m.sea_level : m.pressure;
    var day = todayISO();
    S.weather[day] = { pMean: (pres != null) ? Math.round(pres) : null, tMean: (m.temp != null) ? Math.round(m.temp) : null };
    if (lat != null) { S.profile.lat = lat; S.profile.lng = lon; }
    if (label) S.profile.place = label;
    S.ui.wxResults = null;
    S.ui.wxStatus = "Saved today's reading" + (S.profile.place ? " for " + S.profile.place : "") + ". Open the app and tap again each day to build the trend.";
    persist(); render();
  }).catch(function (e) {
    if (e && /401/.test(e.message)) S.ui.wxStatus = "keybad"; else S.ui.wxStatus = "blocked";
    render();
  });
}
function wxSearchCity(q) {
  q = (q || "").trim();
  if (!q) { S.ui.wxStatus = "Type a town or city first."; render(); return; }
  if (!OWM_KEY) { S.ui.wxStatus = "nokey"; render(); return; }
  S.ui.wxStatus = "Searching for " + q + "…"; S.ui.wxResults = null; render();
  var url = "https://api.openweathermap.org/geo/1.0/direct?q=" + encodeURIComponent(q) + "&limit=5&appid=" + OWM_KEY;
  fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then(function (arr) {
    if (!arr || !arr.length) { S.ui.wxResults = []; S.ui.wxStatus = "No place found for '" + q + "'. Try adding the country, e.g. 'Paris, FR'."; render(); return; }
    S.ui.wxResults = arr.map(function (p) { return { name: p.name, state: p.state || "", country: p.country || "", lat: p.lat, lon: p.lon }; });
    S.ui.wxStatus = ""; render();
  }).catch(function (e) { if (e && /401/.test(e.message)) S.ui.wxStatus = "keybad"; else S.ui.wxStatus = "blocked"; render(); });
}
function geoWeather() {
  if (!navigator.geolocation) { S.ui.wxStatus = "This device can't share location. Search a town or city instead."; render(); return; }
  if (!OWM_KEY) { S.ui.wxStatus = "nokey"; render(); return; }
  S.ui.wxStatus = "Asking for your location…"; render();
  navigator.geolocation.getCurrentPosition(
    function (pos) { owmCurrent(pos.coords.latitude, pos.coords.longitude, "your location"); },
    function (err) { S.ui.wxStatus = (err && err.code === 1) ? "Location permission was declined. You can search a town or city, or enter pressure by hand." : "Couldn't get your location. Try a city search, or manual entry."; render(); },
    { enableHighAccuracy: false, timeout: 10000, maximumAge: 3600000 }
  );
}

/* ============================ CLICK ACTIONS ============================ */
function onClick(ev) {
  var el = ev.target.closest ? ev.target.closest("[data-act]") : null; if (!el) return;
  var act = el.dataset.act; var d = el.dataset;
  switch (act) {
    case "tab": S.tab = d.tab; render(); break;
    case "afont": S.ui.afont = !S.ui.afont; persist(); render(); break;
    case "symflag": { S.ui.symFlags = S.ui.symFlags || {}; S.ui.symFlags[d.k] = !S.ui.symFlags[d.k]; render(); break; }
    case "symSave": {
      var date = gv("symDate") || todayISO(); var f = S.ui.symFlags || {};
      S.symptoms = S.symptoms.filter(function (s) { return s.date !== date; });
      S.symptoms.push({ date: date, severity: num(S.ui.sev || 0), vertigo: !!f.vertigo, tinnitus: !!f.tinnitus, hearing: !!f.hearing, fullness: !!f.fullness, positional: !!f.positional, notes: S.ui.symNote || "" });
      S.ui.symFlags = {}; S.ui.sev = 0; S.ui.symNote = ""; persist(); render(); break;
    }
    case "symDel": S.symptoms = S.symptoms.filter(function (s) { return s.date !== d.date; }); persist(); render(); break;
    case "pickImg": { var hi = document.getElementById("hearImg"); if (hi) hi.click(); break; }
    case "rmImg": { readHearForm(); S.ui.hearForm.image = null; render(); break; }
    case "hearSave": {
      var hf2 = readHearForm();
      var L = (hf2.left === "" || hf2.left == null) ? avgVals(hf2.freqL) : num(hf2.left);
      var R = (hf2.right === "" || hf2.right == null) ? avgVals(hf2.freqR) : num(hf2.right);
      var fL = {}, fR = {}, hasFreq = false;
      AUDIO_FREQS.forEach(function (f) { var a = hf2.freqL[f], b = hf2.freqR[f]; if (a !== "" && a != null) { fL[f] = num(a); hasFreq = true; } if (b !== "" && b != null) { fR[f] = num(b); hasFreq = true; } });
      if (L == null && R == null && !hf2.image && !hasFreq) { alert("Add a photo, an average dB level, or the full curve for at least one ear."); break; }
      S.hearing.push({ id: uid(), date: hf2.date || todayISO(), leftDb: L, rightDb: R, source: hf2.source || "Clinic audiogram", notes: hf2.notes || "", image: hf2.image || null, freqL: fL, freqR: fR });
      var keepSrc = hf2.source || "Clinic audiogram";
      S.ui.hearForm = { date: todayISO(), left: "", right: "", source: keepSrc, notes: "", image: null, freqL: {}, freqR: {} };
      if (!persist()) alert("Saved for now, but the device's storage is nearly full. Photos take space — download a backup and remove a few old entries if saving stops working.");
      render(); break;
    }
    case "hearDel": S.hearing = S.hearing.filter(function (h) { return h.id !== d.id; }); persist(); render(); break;
    case "addFood": { var nm = d.name; var fd = null; foodList().forEach(function (x) { if (x.name === nm) fd = x; }); if (fd) { var it = { id: uid(), name: fd.name, date: S.ui.dietDate || todayISO(), kind: "food", flags: fd.flags || [] };["sodium", "potassium", "sugar", "caffeine", "alcohol", "fluid"].forEach(function (k) { it[k] = num(fd[k]); }); S.diet.push(it); persist(); render(); } break; }
    case "addMed": {
      var mn = (gv("medName") || "").trim(); if (!mn) { alert("Type the medication or supplement name first."); break; }
      var mit = { id: uid(), name: mn, date: S.ui.dietDate || todayISO(), kind: "med", flags: [] };["sodium", "potassium", "sugar", "caffeine", "alcohol", "fluid"].forEach(function (k) { mit[k] = 0; }); S.diet.push(mit); persist(); render(); break;
    }
    case "addCustom": {
      var name = (gv("cfName") || "").trim(); if (!name) { alert("Give the item a name."); break; }
      S.customFoods.unshift({ name: name, sodium: nv("cfSodium"), potassium: nv("cfPotassium"), sugar: nv("cfSugar"), caffeine: nv("cfCaffeine"), alcohol: nv("cfAlcohol"), fluid: nv("cfFluid"), flags: [] });
      S.ui.foodQuery = name; persist(); render(); break;
    }
    case "delCustom": S.customFoods.splice(num(d.i), 1); persist(); render(); break;
    case "editDiet": S.ui.editDietId = d.id; render(); break;
    case "cancelEdit": S.ui.editDietId = null; render(); break;
    case "saveDiet": { S.diet.forEach(function (x) { if (x.id === d.id) {["sodium", "potassium", "sugar", "caffeine", "alcohol", "fluid"].forEach(function (k) { x[k] = nv("ed_" + k); }); } }); S.ui.editDietId = null; persist(); render(); break; }
    case "delDiet": S.diet = S.diet.filter(function (x) { return x.id !== d.id; }); persist(); render(); break;
    case "wxSave": { var wd = gv("wxDate") || todayISO(); var pr = gv("wxPressure"); if (pr === "") { alert("Enter the pressure value."); break; } var tIn = gv("wxTemp"); var tF = null; if (tIn !== "") { var tv = num(tIn); tF = (S.profile.units === "C") ? Math.round(tv * 9 / 5 + 32) : Math.round(tv); } S.weather[wd] = { pMean: Math.round(num(pr)), tMean: tF }; S.ui.wxStatus = ""; persist(); render(); break; }
    case "wxSearch": { S.ui.wxCityQ = (gv("wxCity") || "").trim(); wxSearchCity(S.ui.wxCityQ); break; }
    case "wxPick": { var rs = S.ui.wxResults || []; var pk = rs[num(d.i)]; if (pk) { var lab = pk.name + (pk.state ? ", " + pk.state : "") + (pk.country ? ", " + pk.country : ""); owmCurrent(pk.lat, pk.lon, lab); } break; }
    case "wxToday": { if (S.profile.lat != null) owmCurrent(S.profile.lat, S.profile.lng, S.profile.place); break; }
    case "wxGeo": geoWeather(); break;
    case "wxUnits": { S.profile.units = (d.u === "C" ? "C" : "F"); persist(); render(); break; }
    case "addCond": { var c = (gv("condInput") || "").trim(); if (c) { S.conditions.push(c); persist(); render(); } break; }
    case "delCond": S.conditions.splice(num(d.i), 1); persist(); render(); break;
    case "toggleCause": S.ui.openCause = (S.ui.openCause === d.id ? null : d.id); render(); break;
    case "ans": { if (!S.answers[d.cause]) S.answers[d.cause] = {}; if (S.answers[d.cause][d.q] === d.key) delete S.answers[d.cause][d.q]; else S.answers[d.cause][d.q] = d.key; persist(); render(); break; }
    case "testSet": { if (S.tests[d.id] === d.val) delete S.tests[d.id]; else S.tests[d.id] = d.val; persist(); render(); break; }
    case "sbToggle": { S.tests.stopbang = S.tests.stopbang || {}; S.tests.stopbang[d.k] = !S.tests.stopbang[d.k]; persist(); render(); break; }
    case "insFactor": S.ui.insFactor = d.key; render(); break;
    case "tlToggle": {
      var cur = (S.ui.tlSeries && S.ui.tlSeries.length) ? S.ui.tlSeries.slice() : TL_DEFAULT.slice();
      var ix = cur.indexOf(d.key); if (ix >= 0) cur.splice(ix, 1); else cur.push(d.key);
      S.ui.tlSeries = cur; persist(); render(); break;
    }
    case "actToggle": { S.ui.actSel = S.ui.actSel || {}; S.ui.actSel[d.k] = !S.ui.actSel[d.k]; render(); break; }
    case "addActivity": {
      var an = (gv("actCustom") || "").trim(); if (!an) { alert("Type an activity name first."); break; }
      if (S.customActivities.indexOf(an) < 0 && DEFAULT_ACTS.indexOf(an) < 0) S.customActivities.push(an);
      S.ui.actSel = S.ui.actSel || {}; S.ui.actSel[an] = true; persist(); render(); break;
    }
    case "delCustomAct": { var ci = num(d.i); S.customActivities.splice(ci, 1); persist(); render(); break; }
    case "actSave": {
      var adate = gv("actDate") || todayISO();
      var sh = gv("actSleep"); var hours = (sh === "" || sh == null) ? null : num(sh);
      var sel = S.ui.actSel || {}; var acts = Object.keys(sel).filter(function (k) { return sel[k]; });
      var anote = S.ui.actNote || "";
      S.activity = S.activity.filter(function (a) { return a.date !== adate; });
      S.activity.push({ date: adate, sleepHours: hours, activities: acts, notes: anote });
      S.ui.actLoadedFor = null; persist(); render(); break;
    }
    case "actDel": { S.activity = S.activity.filter(function (a) { return a.date !== d.date; }); S.ui.actLoadedFor = null; persist(); render(); break; }
    case "actSync": { S.ui.actSyncInfo = !S.ui.actSyncInfo; render(); break; }
    case "expReport": download("meniere-report.txt", buildReport(computeResults()), "text/plain"); break;
    case "expJson": download("meniere-backup.json", JSON.stringify({ profile: S.profile, symptoms: S.symptoms, diet: S.diet, customFoods: S.customFoods, activity: S.activity, customActivities: S.customActivities, weather: S.weather, answers: S.answers, tests: S.tests, conditions: S.conditions, hearing: S.hearing, afont: S.ui.afont, tlSeries: S.ui.tlSeries, exportedAt: new Date().toISOString() }, null, 2), "application/json"); break;
    case "restore": { var rf = document.getElementById("restoreFile"); if (rf) rf.click(); break; }
    default: break;
  }
}

/* ============================ MOUNT ============================ */
document.addEventListener("click", onClick);
render();
window.__APP_OK = true;

})();
</script>
