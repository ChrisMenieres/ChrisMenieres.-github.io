<script>
/* Safety net: if anything throws DURING BOOT, show it on screen instead of a blank/loading hang.
   Ignore errors injected by the browser itself (e.g. the __gCrWeb bridge in Brave/Chrome on iOS),
   and never overwrite the screen once the app has already started successfully. */
window.addEventListener("error", function (e) {
  var msg = (e && e.message) ? String(e.message) : "";
  if (msg.indexOf("gCrWeb") >= 0) return;          // browser-injected, not our app
  if (window.__APP_OK) return;                       // app already running fine; ignore stray errors
  var b = document.getElementById("boot") || document.getElementById("root");
  if (b) b.innerHTML = '<div style="max-width:520px;margin:60px auto;padding:0 20px;text-align:left;line-height:1.6;font-family:system-ui,sans-serif">' +
    '<b style="color:#C56B4A">The app hit an error.</b><br><br>' + ((e && e.message) ? e.message : "Unknown error") +
    ((e && e.lineno) ? '<br><span style="font-size:12px;color:#9A9388">line ' + e.lineno + '</span>' : '') +
    '<br><br>A screenshot of this would let me fix it fast.</div>';
});
</script>

function matchConditions(list) {
  return (list || []).map(function (raw) {
    var text = " " + String(raw).toLowerCase().trim() + " ";
    var low = String(raw).toLowerCase();
    var tokens = low.split(/[^a-z0-9]+/).filter(Boolean);
    var matches = CONDITIONS.filter(function (c) {
      return c.keys.some(function (k) {
        if (k.length <= 4) return tokens.indexOf(k) >= 0;   /* short / acronym: whole word only */
        return low.indexOf(k) >= 0;                          /* longer: substring is fine */
      });
    });
    var mechanisms = MECHANISMS.filter(function (m) { return m.keys.some(function (k) { return text.indexOf(k) >= 0; }); });
    return { input: raw, matches: matches, mechanisms: mechanisms };
  }).filter(function (m) { return String(m.input).trim(); });
}
function aggregateCauseLinks(matched) {
  var map = {};
  matched.forEach(function (m) {
    m.matches.forEach(function (c) { c.causes.forEach(function (id) { if (!map[id]) map[id] = []; if (map[id].indexOf(c.name) < 0) map[id].push(c.name); }); });
    m.mechanisms.forEach(function (mech) { mech.causes.forEach(function (id) { if (!map[id]) map[id] = []; if (map[id].indexOf(mech.label) < 0) map[id].push(mech.label); }); });
  });
  return map;
}

  if (best && best.lag > 0 && Math.abs(best.r) >= 0.3) {
    var bdir = invert ? -best.r : best.r;
    lagNote = '<div class="note" style="margin-top:10px;background:var(--goldSoft);color:#8A6516;align-items:flex-start">' + ic("info", 16, "#C99A3F") + '<span style="font-weight:600">Delayed effect: the link looks strongest ' + lagWord(best.lag) + ' (r = ' + best.r.toFixed(2) + '). ' + (bdir > 0 ? 'Symptoms tend to rise a little while after this changes, not always the same day.' : '') + '</span></div>';
  } else if (best && best.lag === 0 && Math.abs(best.r) >= 0.3) {
    lagNote = '<div style="margin-top:8px;font-size:12.5px;color:var(--faint)">Checked for a delayed effect too — the link is strongest on the same day here.</div>';
  }
  var chartData = paired.map(function (x) { return { x: x.date ? fmtDay(x.date) : "", Factor: x[fk], Symptoms: x.sev }; });

  var items = itemFindings(2);
  var catLabel = { food: "food / drink", med: "medication / supplement" };
  var itemsCard = '<div class="card">' + sectionTitle("Specific foods, drinks & meds", "Beyond salt and sugar, this checks each individual item you log — by name — against your worse days, including the day or two AFTER. Needs an item on 3+ days to judge it.") +

      }).join("") + '</div><p style="margin:10px 0 0;font-size:12px;color:var(--faint);line-height:1.5">A link is not proof. The best next step is to remove one suspect for a few weeks and watch the diary.</p>'
      : emptyMsg("No single-item links yet. Keep logging foods, drinks and medications each day.")) +
    '</div>';

  var combos = comboFindings();
  var combosCard = '<div class="card">' + sectionTitle("Trigger combinations", "Sometimes one thing alone is fine, but two together set things off (for example salt AND potassium). This compares days where a pair is both high against days where only one is.") +

      }).join("") + '</div><p style="margin:10px 0 0;font-size:12px;color:var(--faint);line-height:1.5">Worth testing by keeping one of the pair low for a couple of weeks.</p>'

    '</div>';

  var acts = activityFindings(2);
  var actCard = '<div class="card">' + sectionTitle("Activities & symptoms", "Checks each activity you log — flying, exertion, hot baths, scuba and so on — against your symptom score on the same day and the day or two after. Rare events show up too, so treat a low count as a hint, not proof.") +
    (acts.length ?

      }).join("") + '</div><p style="margin:10px 0 0;font-size:12px;color:var(--faint);line-height:1.5">A spike right after one activity (like scuba or flying) is worth noting even from a single day — but it only becomes a real pattern once it repeats.</p>'

      '<div style="display:flex;flex-wrap:wrap;gap:7px">' + factors.map(function (f) { return '<button class="chip ' + (fk === f[0] ? "on" : "") + '" data-act="insFactor" data-key="' + f[0] + '">' + esc(f[1]) + '</button>'; }).join("") + '</div>' +
      '<div class="note" style="margin-top:14px;background:var(--surface);border:1px solid var(--line);color:' + color2 + '">' + ic("info", 16) + '<span style="font-weight:600">' + esc(strength) + (r != null ? ' (r = ' + r.toFixed(2) + ', ' + paired.length + ' days)' : '') + '</span></div>' +
      (r != null ? '<details style="margin-top:8px"><summary style="cursor:pointer;color:var(--primary);font-weight:700;font-size:13px">What does r mean?</summary>' +
        '<div style="font-size:13px;line-height:1.65;color:var(--ink);margin-top:8px">' +
          '<p style="margin:0 0 8px">r measures how closely two things move together. It runs from −1 to +1.</p>' +
          '<p style="margin:0 0 8px"><b>+1</b> = they rise and fall together perfectly. <b>0</b> = no link at all. <b>−1</b> = perfect opposites (one goes up when the other goes down).</p>' +
          '<p style="margin:0 0 8px">Example: <b>r = 0.43</b> means a moderate link — your worse days and this factor\'s high days line up more often than chance, but far from always. Rough guide: under 0.2 is little or no link, 0.2–0.4 is mild, 0.4–0.6 is moderate, above 0.6 is strong.</p>' +
          '<p style="margin:0">Two cautions. A link is not proof of cause — both things could follow something else (like stress driving both salty food and symptoms). And with only a handful of days, r jumps around a lot; trust it more as the day count grows.</p>' +
        '</div></details>' : '') +
      lagNote +
    '</div>' +
    itemsCard +
    actCard +
    combosCard +
  '</div>';
}

function viewAbout() {

    case "addCond": { var c = (gv("condInput") || "").trim(); if (c) { S.conditions.push(c); S.ui.condQuery = ""; persist(); render(); toast("Added"); } break; }
    case "addCondName": { if (d.name) { S.conditions.push(d.name); S.ui.condQuery = ""; persist(); render(); toast("Added " + d.name); } break; }
    case "delCond": S.conditions.splice(num(d.i), 1); persist(); render(); break;
    case "toggleCause": S.ui.openCause = (S.ui.openCause === d.id ? null : d.id); render(); break;
    case "ans": { if (!S.answers[d.cause]) S.answers[d.cause] = {}; if (S.answers[d.cause][d.q] === d.key) delete S.answers[d.cause][d.q]; else S.answers[d.cause][d.q] = d.key; persist(); render(); break; }
    case "testSet": { if (S.tests[d.id] === d.val) delete S.tests[d.id]; else S.tests[d.id] = d.val; persist(); render(); break; }
    case "flsSet": { S.ui.flsLevel = num(d.n); render(); break; }
    case "flsSave": { if (S.ui.flsLevel != null) { var ft = todayISO(); S.fls = S.fls.filter(function (x) { return x.date !== ft; }); S.fls.push({ date: ft, level: num(S.ui.flsLevel) }); S.ui.flsLevel = null; persist(); render(); toast("Level saved"); } break; }
    case "flsDel": { S.fls = S.fls.filter(function (x) { return x.date !== d.date; }); persist(); render(); break; }
    case "vmAns": { S.vm = S.vm || {}; if (S.vm[d.id] === d.key) delete S.vm[d.id]; else S.vm[d.id] = d.key; persist(); render(); break; }
    case "vtSave": {
      var f = S.ui.vtForm || {};
      var vDate = gv("vtDate") || f.date || todayISO();
      var vType = gv("vtType") || f.type || VEST_TYPES[0];
      var vEar = gv("vtEar") || f.ear || VEST_EARS[0];
      var vFinding = gv("vtFinding") || f.finding || "";
      var vValue = (gv("vtValue") || f.value || "").trim();
      var vNotes = (gv("vtNotes") || f.notes || "").trim();
      if (vtUnsure(vFinding) && !vValue && !vNotes) { alert("Pick a finding, or add a value or note, before saving."); break; }
      S.vestTests.push({ id: uid(), date: vDate, type: vType, ear: vEar, finding: vtUnsure(vFinding) ? "" : vFinding, value: vValue, notes: vNotes });
      S.ui.vtForm = { date: todayISO(), type: VEST_TYPES[0], ear: VEST_EARS[0], finding: "", value: "", notes: "" };
      persist(); render(); toast("Result saved"); break;
    }
    case "vtDel": { S.vestTests = S.vestTests.filter(function (v) { return v.id !== d.id; }); persist(); render(); break; }
    case "sbToggle": { S.tests.stopbang = S.tests.stopbang || {}; S.tests.stopbang[d.k] = !S.tests.stopbang[d.k]; persist(); render(); break; }
    case "insFactor": S.ui.insFactor = d.key; render(); break;
    case "tlToggle": {
      var cur = (S.ui.tlSeries && S.ui.tlSeries.length) ? S.ui.tlSeries.slice() : TL_DEFAULT.slice();
      var ix = cur.indexOf(d.key); if (ix >= 0) cur.splice(ix, 1); else cur.push(d.key);
      S.ui.tlSeries = cur; persist(); render(); break;
    }
    case "actToggle": { S.ui.actSel = S.ui.actSel || {}; S.ui.actSel[d.k] = !S.ui.actSel[d.k]; render(); break; }
    case "actNicToggle": { S.ui.actNic = !S.ui.actNic; render(); break; }
    case "addActivity": {
      var an = (gv("actCustom") || "").trim(); if (!an) { alert("Type an activity name first."); break; }
      if (S.customActivities.indexOf(an) < 0 && DEFAULT_ACTS.indexOf(an) < 0) S.customActivities.push(an);
      S.ui.actSel = S.ui.actSel || {}; S.ui.actSel[an] = true; persist(); render(); toast("Added " + an); break;
    }
    case "delCustomAct": { var ci = num(d.i); S.customActivities.splice(ci, 1); persist(); render(); break; }
    case "actSave": {
      var adate = gv("actDate") || todayISO();
      var sh = gv("actSleep"); var hours = (sh === "" || sh == null) ? null : num(sh);
      var sel = S.ui.actSel || {}; var acts = Object.keys(sel).filter(function (k) { return sel[k]; });
      var anote = S.ui.actNote || "";
      var sstress = num(S.ui.actStress || 0); var stressVal = sstress > 0 ? sstress : null;
      S.activity = S.activity.filter(function (a) { return a.date !== adate; });
      S.activity.push({ date: adate, sleepHours: hours, stress: stressVal, activities: acts, notes: anote, nicotine: !!S.ui.actNic, cycle: !!S.ui.actCycle });
      S.ui.actLoadedFor = null; persist(); render(); toast("Day saved"); break;
    }
    case "actDel": { S.activity = S.activity.filter(function (a) { return a.date !== d.date; }); S.ui.actLoadedFor = null; persist(); render(); break; }
    case "expReport": download("meniere-report.txt", buildReport(computeResults()), "text/plain"); break;
    case "expJson": download("meniere-backup.json", JSON.stringify({ profile: S.profile, symptoms: S.symptoms, diet: S.diet, customFoods: S.customFoods, activity: S.activity, customActivities: S.customActivities, weather: S.weather, answers: S.answers, tests: S.tests, conditions: S.conditions, hearing: S.hearing, fls: S.fls, attacks: S.attacks, txMarkers: S.txMarkers, vestTests: S.vestTests, vm: S.vm, stepsDone: S.stepsDone, tlSeries: S.ui.tlSeries, exportedAt: new Date().toISOString() }, null, 2), "application/json"); S.meta.lastBackup = new Date().toISOString(); persist(); render(); break;
    case "snoozeBackup": S.meta.nudgeSnoozed = new Date().toISOString(); persist(); render(); break;
    case "installDismiss": S.meta.installDismissed = true; persist(); render(); break;
    case "installNow": {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function (c) {
          if (c && c.outcome === "accepted") { S.meta.installDismissed = true; persist(); }
          deferredPrompt = null; render();
        });
      }
      break;
    }
    case "restore": { var rf = document.getElementById("restoreFile"); if (rf) rf.click(); break; }
    default: break;
  }
}

/* ============================ MOUNT ============================ */
document.addEventListener("click", onClick);
render();
/* Auto-pull today's weather when the app opens, using the saved location.
   One call covers the whole day, so opening once (e.g. in the evening) is enough. */
maybeAutoWeather();
/* Also refresh when the app is reopened or brought back to the foreground. On an
   installed PWA the page is often resumed (not reloaded), so without this the
   chart can sit on yesterday's data after a new day starts. */
document.addEventListener("visibilitychange", function () { if (!document.hidden) maybeAutoWeather(); });
window.addEventListener("pageshow", function () { maybeAutoWeather(); });
window.addEventListener("focus", function () { maybeAutoWeather(); });
window.__APP_OK = true;

})();
